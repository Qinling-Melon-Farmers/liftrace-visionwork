land_height: 0.2                            #切入降落之前的高度，不要太高，也不能太小（太小容易与地面剐蹭）
px4_max_distance: 1.0                       #直接发送点位时，最大变化距离（直接给mavros发送点时决定最大速度）
max_yaw_change: 0.2                         #直接发送点位时，最大变化yaw
align_height: 1.2                           #对准高度
waypoint_skipping_index: 8                   #路点跳跃，为Nothing_point和Land_point总和，三个快递全部投递完成，直接跳跃到穿走廊的点
# 渐进降高参数 (新增)
progressive_descent:
  enable: true                              #是否启用对准过程中的渐进降高功能
  target_height: 0.8                      #渐进降高的目标高度(m)
  descent_duration: 5.0                     #从检测到圆环到降至目标高度的总时长(s)
  min_detection_count: 5                    #开始渐进降高前需要的最少检测次数

# threshould
threshould: 
  takeoff_threshould: 0.15                   #判断是否到达起飞点的阈值
  waypoint_threshould: 0.30                  #判断是否到达路点点的阈值
  aligning_threshould: 0.30                #判断是否到达对准点的阈值
  landing_threshould: 0.3                  #判断是否到达降落点的阈值
  arrive_yaw_threshould: 0.3                #判断yaw是否到位的阈值
  times_detect_threshould: 300        #路点为对准时，调整到位的次数阈值(次)，判断次数大于这个阈值即认为已经对准
  waypoint_adjust_max_second_threshould: 15 #路点为对准时，最大调整时间阈值(s)，超过阈值直接去下一个点
  land_adjust_max_second_threshould: 10     #路点为对准时，最大调整时间阈值(s)，超过阈值直接降落
  planner_min_pub_threshould: 0.025         #限制往planner发送目标点的频率

dynamic:
  ranger_height: 0.3
  
# bool switch
switch:
 flag_planner_px4: 0    # 0: planner   1: px4  ，设为0则使用planner在路点之间规划路径，设为1则使用直线在路点之间飞行
 flag_landing_detect: 1 # land detect flag  ，该标志位判断是否需要精确降落，0代表不检测，直接降落，1代表接收降落检测对准目标，对准之后再降落
 auto_land: 0           # auto_land flag  ，该标志位判断是否需要切入auto land，0代表不使用autoland,直接发送高度为-1的点, 1代表使用auto land模式降落
