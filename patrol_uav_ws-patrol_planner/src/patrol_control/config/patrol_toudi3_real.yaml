# toudi3.world 场地适配的完整比赛路线配置（含走廊穿越）。
#
# 场地几何（toudi2 走廊模型，2026-08-01 方案 A 改墙后，世界绝对坐标）：
#   南墙 Wall_1:  y=-2.83（x∈[-4.48,3.52]）
#   东墙 Wall_11: x=3.44
#   北墙 Wall_9:  y=6.87（连续 8m 无门）
#   西通道：Wall_6 内壁 x=-4.335 与 Wall_16 西缘 x=-3.134 之间，宽 1.2m
#   内部隔断：Wall_15 组合墙 y∈[4.225,4.375]，西段 x∈[-3.134,-1.870] 有半高通廊
#     （z∈[0.5,1.3] 净高 0.8m 可穿，穿过点 x≈-2.3）
#   半高障碍：big_box3 顶 1.25m（y∈[2.05,2.85] 区域），>1.3m 可飞越
#
# 标准靶标真值（world 内嵌模型绝对坐标）：
#   dibao→pillbox(-0.602,-1.041)  qiaoliang→bridge(-1.903,-0.023)
#   zhangpeng→tent(1.016,0.256)   zhuangjiache→panzer(-1.589,3.022)
#   tanke→tank(0.283,3.856)       H→(0,0)

# 目标类别（sim_helpers 动态 mock 与补丁 A 的 goal_list 匹配）
goal_list: ["bridge", "panzer", "pillbox", "tent", "tank"]

# 3 投后不跳降落段，顺序推进走廊航点（补丁 B）
detect_skip_enable: false

waypoints:
  - {x: 0.000, y: 0.000, z: 1.5, yaw: 0.0, pointmode: "Takeoff_point", hover_time: 0.0}

  # 投递点 1-3（标准靶上方，对应舵机 1/2/3）
  # z=1.2 低于树顶 1.5m，树木成为必须绕行的全高障碍（验证避障能力）
  - {x: -0.602, y: -1.041, z: 1.2, yaw: 0.0, pointmode: "Detect_point", hover_time: 5.0}   # dibao/pillbox
  - {x: 1.016, y: 0.256, z: 1.2, yaw: 0.0, pointmode: "Detect_point", hover_time: 5.0}   # zhangpeng/tent
  - {x: -1.589, y: 3.022, z: 1.2, yaw: 0.0, pointmode: "Detect_point", hover_time: 5.0}  # zhuangjiache/panzer

  # 走廊去程：进入西通道（x=-3.7，Wall_6 内壁 -4.335 与 V2 西端 -3.734 之间）
  - {x: -3.700, y: 3.400, z: 1.5, yaw: 1.5708, pointmode: "Nothing_point", hover_time: 0.0}  # 通道南口

  # 过门段：向东直进门洞（Wall_15 西移后门洞 x∈[-3.27,-1.87]，z 0.65~1.3 可穿）
  - {x: -2.300, y: 4.000, z: 1.0, yaw: 0.0, pointmode: "Nothing_point", hover_time: 0.0}    # 门洞南侧接近
  - {x: -2.300, y: 4.450, z: 1.0, yaw: 0.0, pointmode: "Nothing_point", hover_time: 0.0}    # 穿门洞（z=1.0 在 [0.65,1.3] 内）

  # 北区：返回通道，北向到走廊尽头
  - {x: -3.700, y: 5.300, z: 1.5, yaw: 1.5708, pointmode: "Nothing_point", hover_time: 0.0}  # 回通道北段
  - {x: -3.700, y: 6.300, z: 1.5, yaw: 1.5708, pointmode: "Nothing_point", hover_time: 0.0}  # 通道北端（距北墙 0.5m）

  # 北区东进（Wall_20/22 门洞带 y∈[5.83,6.73]，x≈0.6 通过）
  - {x: 0.300, y: 6.260, z: 1.5, yaw: 0.0, pointmode: "Nothing_point", hover_time: 0.0}

  # 回程：原路返回通道南口
  - {x: -3.700, y: 6.300, z: 1.5, yaw: -1.5708, pointmode: "Nothing_point", hover_time: 0.0}
  - {x: -3.700, y: 3.400, z: 1.5, yaw: -1.5708, pointmode: "Nothing_point", hover_time: 0.0}

  # 降高段（移出 Big box 4 包络 x>1.49；z 下限 0.5 防贴地断连）
  - {x: 2.000, y: 5.000, z: 0.65, yaw: 0.0, pointmode: "Nothing_point", hover_time: 2.0}
  - {x: 2.000, y: 5.000, z: 0.50, yaw: 0.0, pointmode: "Nothing_point", hover_time: 2.0}
  - {x: 2.000, y: 5.000, z: 0.65, yaw: 0.0, pointmode: "Nothing_point", hover_time: 1.0}

  # 返航与降落（H 位于 (0,0)）
  - {x: 2.500, y: 4.000, z: 1.0, yaw: 0.0, pointmode: "Nothing_point", hover_time: 0.0}
  - {x: 2.000, y: 1.000, z: 1.0, yaw: 0.0, pointmode: "Nothing_point", hover_time: 0.0}
  - {x: 0.000, y: 0.000, z: 0.8, yaw: 0.0, pointmode: "Land_point", hover_time: 0.0}

waypoint_skipping_index: 4
land_height: 0.30
align_height: 1.20
px4_max_distance: 0.20
max_yaw_change: 0.20

progressive_descent:
  enable: true
  target_height: 0.40
  intermediate_height: 0.70
  descent_duration: 5.0
  final_descent_duration: 2.0
  min_detection_count: 5

alignment:
  threshold: 20.0
  stable_count_threshold: 10
  timeout: 30.0

threshould:
  takeoff_threshould: 0.30
  waypoint_threshould: 0.30
  aligning_threshould: 0.20
  landing_threshould: 0.15
  arrive_yaw_threshould: 0.30
  times_detect_threshould: 40
  waypoint_adjust_max_second_threshould: 15
  land_adjust_max_second_threshould: 10
  planner_min_pub_threshould: 0.025

switch:
  flag_planner_px4: 1
  flag_landing_detect: 1
  auto_land: 1

drop_system:
  precision_threshold: 20.0
  height_threshold: 0.20
  enable_drop: true
  descent_stable_duration: 2.0

uav_vision:
  selected_target_timeout: 1.0
  drop_offset_timeout: 1.0
  pixel_to_meter_ratio: 0.0015
  max_movement_distance: 0.5
  drop_circle_radius_m: 0.5
  drop_cross_radius_m: 0.5
  landing_pad_radius_m: 0.30
  enable_tank_interrupt: false
