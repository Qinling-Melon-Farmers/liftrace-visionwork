# Coverage policy for the central target-search region. No target coordinates.
mission_frame: camera_init

# Physical arena bounds are used only for flight-boundary validation.
field:
  min_x: -5.0
  max_x: 5.0
  min_y: -5.0
  max_y: 5.0

# Search-zone geometry is independent of target placement and excludes the
# north corridor that is outside the current visual-delivery Gate.
search_region:
  min_x: -2.5
  max_x: 1.5
  min_y: -1.5
  max_y: 4.5

coverage:
  safety_margin: 0.5
  tracking_reserve: 0.0
  spacing: 1.0
  height: 2.0
  dwell_time: 2.0

navigation:
  takeoff_height: 1.7
  # Coverage does not start until a recent inflated occupancy cloud exists.
  map_ready_timeout: 60.0
  map_max_age: 2.0
  arrival_radius: 0.40
  # Reset the unreachable watchdog after each meaningful approach increment.
  progress_epsilon: 0.10
  endpoint_clearance: 0.35
  endpoint_max_adjustment: 1.0
  collision_clearance: 0.10
  recovery_height: 0.95
  landing_height: 0.15
  landing_timeout: 90.0

candidate:
  semantic_match_distance: 0.75

navigation_only: true
execute_candidates: false
collect_before_delivery: true
final_land: false
required_deliveries: 3
require_north: false
search_timeout: 540.0
mission_timeout: 600.0
