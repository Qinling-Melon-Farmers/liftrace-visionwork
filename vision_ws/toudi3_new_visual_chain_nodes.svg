  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#53616f"/></marker><style>
    .t{font:700 28px sans-serif;fill:#17202a}.s{font:16px sans-serif;fill:#52606d}.b{stroke:#34495e;stroke-width:2;rx:12;ry:12}.i{fill:#e8f8f5}.d{fill:#e8daef}.m{fill:#e7f5e1}.c{fill:#fff3cd}.g{fill:#f1f3f5}.l{font:600 17px sans-serif;fill:#17202a;text-anchor:middle}.x{font:13px sans-serif;fill:#34495e;text-anchor:middle}.e{stroke:#53616f;stroke-width:2.4;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 6}
  </style></defs>
  <rect width="1800" height="1080" fill="#fff"/><text x="55" y="55" class="t">toudi3 新视觉 Phase-D 节点图</text><text x="55" y="84" class="s">run_toudi3_full_competition_sim_gui_new.sh · 新视觉观测链 + 旧控制链</text>
  <rect x="55" y="135" width="260" height="150" class="b i"/><text x="185" y="170" class="l">Gazebo 相机</text><text x="185" y="202" class="x">/camera/color/image_raw</text><text x="185" y="228" class="x">/camera/color/camera_info</text><text x="185" y="254" class="x">header.stamp / frame_id</text>
  <rect x="390" y="135" width="250" height="150" class="b d"/><text x="515" y="170" class="l">粗检测与几何</text><text x="515" y="202" class="x">target_detector</text><text x="515" y="228" class="x">cross_detector</text><text x="515" y="254" class="x">circle_detector / landing_detector</text>
  <rect x="715" y="135" width="250" height="150" class="b d"/><text x="840" y="170" class="l">detection_fusion</text><text x="840" y="202" class="x">/uav_vision/detections</text><text x="840" y="228" class="x">同帧聚合</text><text x="840" y="254" class="x">/uav_vision/detections_resolved</text>
  <rect x="1040" y="135" width="250" height="150" class="b d"/><text x="1165" y="170" class="l">target_refiner</text><text x="1165" y="202" class="x">YOLO 类别框 + 蓝环实例</text><text x="1165" y="228" class="x">center_refined</text><text x="1165" y="254" class="x">/uav_vision/detections_refined</text>
  <rect x="1365" y="135" width="330" height="150" class="b m"/><text x="1530" y="170" class="l">target_map_projector</text><text x="1530" y="202" class="x">CameraInfo + TF + 地面平面</text><text x="1530" y="228" class="x">map_valid / map_point / quality</text><text x="1530" y="254" class="x">/uav_vision/detections_mapped</text>
  <path d="M315 210 L385 210" class="e"/><path d="M640 210 L710 210" class="e"/><path d="M965 210 L1035 210" class="e"/><path d="M1290 210 L1360 210" class="e"/>

  <rect x="260" y="410" width="260" height="150" class="b m"/><text x="390" y="445" class="l">target_memory</text><text x="390" y="477" class="x">同类 + 地图距离关联</text><text x="390" y="503" class="x">confirmed / stable ID</text><text x="390" y="529" class="x">/uav_vision/targets</text>
  <rect x="600" y="410" width="260" height="150" class="b c"/><text x="730" y="445" class="l">drop_aligner</text><text x="730" y="477" class="x">CameraInfo 主点</text><text x="730" y="503" class="x">offset / stable frames</text><text x="730" y="529" class="x">/drop_ready</text>
  <rect x="940" y="410" width="260" height="150" class="b c"/><text x="1070" y="445" class="l">detect_compat_bridge</text><text x="1070" y="477" class="x">/yolo_detect</text><text x="1070" y="503" class="x">/detect/cross_status</text><text x="1070" y="529" class="x">默认不伪造世界 Pose</text>
  <rect x="1280" y="410" width="260" height="150" class="b g"/><text x="1410" y="445" class="l">patrol_control</text><text x="1410" y="477" class="x">旧控制/航点状态机</text><text x="1410" y="503" class="x">兼容读取旧接口</text><text x="1410" y="529" class="x">/mavros setpoint</text>
  <rect x="1580" y="410" width="160" height="150" class="b g"/><text x="1660" y="445" class="l">RViz</text><text x="1660" y="477" class="x">Image</text><text x="1660" y="503" class="x">Pose</text><text x="1660" y="529" class="x">PointCloud</text>
  <path d="M1530 285 C1530 350 390 350 390 405" class="e"/><path d="M520 485 L595 485" class="e"/><path d="M860 485 L935 485" class="e"/><path d="M1200 485 L1275 485" class="e"/><path d="M1540 485 L1575 485" class="e dash"/>
  <path d="M185 285 C185 350 730 350 730 405" class="e dash"/><path d="M185 285 C185 330 1530 330 1530 405" class="e dash"/>

  <rect x="55" y="690" width="1690" height="260" fill="#fafafa" stroke="#d5d8dc" rx="14"/><text x="85" y="730" class="l" text-anchor="start">新链仿真观察要点</text><text x="95" y="770" class="s">1. 标准类别是否进入 detections_resolved；圆环是否被 target_refiner 关联并设置 center_refined=true。</text><text x="95" y="810" class="s">2. 有 CameraInfo、时间对应 TF、有效射线求交时才允许 map_valid=true；否则应明确无效。</text><text x="95" y="850" class="s">3. target_memory 的稳定 ID 来自地图距离优先的跨视角关联；/uav_vision/reset_memory 可清空记忆。</text><text x="95" y="890" class="s">4. drop_ready 仅表示视觉对准稳定；当前不会直接调用舵机，也不等于 release_permission。</text><text x="95" y="930" class="s">5. 新链通过 compat bridge 兼容旧控制状态，但正式世界坐标闭环仍需后续控制接口设计。</text>
</svg>
