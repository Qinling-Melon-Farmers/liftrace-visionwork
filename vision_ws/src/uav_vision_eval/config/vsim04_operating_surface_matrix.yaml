schema_version: 1
evaluation_id: V-SIM-04
design_id: operating-surface-85
diagnostic_only: true
seed: 11
class_profile: r2026
expected_trial_count: 85

# Keep the diagnostic surface on the same frozen performance contract. Named
# slices remain DIAGNOSTIC_ONLY regardless of their metric values.
performance_contract:
  contract_id: vsim04-roadmap-20260830
  sources:
    - VISION_2026_ROADMAP.md#V-SIM-04
    - docs/VISION_LAPTOP_SIM_BASELINE_20260715.md
  thresholds:
    max_p95_confirmation_processing_ms: 200.0
    max_p95_map_error_xy_m: 0.25
  unfrozen_thresholds:
    - min_p_confirm
    - min_p_selected
    - max_tf_failure_rate

# Extended deterministic design. Named slices are diagnostic coverage sets;
# they never replace the formal 23-trial MEASURED run.
target_anchors:
  tent: {target_id: tent_1, xyz: [1.27572, 0.581612, 0.0025]}
  pillbox: {target_id: pillbox_1, xyz: [-0.57481, 0.520346, 0.0025]}
  bridge: {target_id: bridge_1, xyz: [-2.09331, 0.70456, 0.0025]}
  panzer: {target_id: panzer_1, xyz: [-1.47375, 3.62133, 0.0025]}
  red_cross: {target_id: red_cross_1, xyz: [-2.5, -2.5, 0.0025]}

static:
  classes: [tent, pillbox, bridge, panzer, red_cross]
  heights_m: [1.2, 1.8, 2.4, 3.0, 3.6]
  center_dwell_sec: 2.0

dynamic:
  classes: [tent, pillbox, bridge, panzer, red_cross]
  heights_m: [1.2, 2.4, 3.6]
  speeds_mps: [0.5, 1.0, 1.5, 2.0]
