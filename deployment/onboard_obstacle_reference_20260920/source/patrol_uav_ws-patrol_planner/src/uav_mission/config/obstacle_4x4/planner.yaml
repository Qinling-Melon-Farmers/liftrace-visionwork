# XY obstacle-extrusion bounds are NOT a geofence.
fsm/allow_goal_adjustment: true
fsm/goal_adjustment_radius: 0.1
fsm/tracking_replan_distance: 0.45
fsm/min_replan_interval: 0.75
sdf_map/obstacles_inflation: 0.1
sdf_map/obstacles_inflation_up: 0.1
sdf_map/obstacles_inflation_down: 0.1
sdf_map/horizontal_avoidance/enabled: true
sdf_map/horizontal_avoidance/min_x: -2.0
sdf_map/horizontal_avoidance/max_x: 2.0
sdf_map/horizontal_avoidance/min_y: 0.0
sdf_map/horizontal_avoidance/max_y: 4.0
sdf_map/horizontal_avoidance/support_min_points: 3
sdf_map/horizontal_avoidance/support_radius: 0.15
sdf_map/horizontal_avoidance/support_min_vertical_span: 0.1
sdf_map/resolution: 0.05
sdf_map/map_size_x: 6.0
sdf_map/map_size_y: 10.0
sdf_map/map_size_z: 1.5
sdf_map/visualization_rate: 1.0
search/max_search_time: 0.25
search/min_horizon_progress: 0.2
search/direct_shot_distance: 2.0
manager/control_points_distance: 0.2
optimization/dist0: 0.1
