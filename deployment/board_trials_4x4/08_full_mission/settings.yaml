mode: high_view_full
low_agl: 1.4
high_agl: 2.6
# 投递下降模式：1=原XYZ；2=冻结XY/Z轨迹；3=零水平速度；4=冻结XY/VZ加速制动。
drop_descent_mode: 2
drop_horizontal_compensation_mode: 2  # 1=双XY<=4cm且速度<=0.1m/s连续1s；2=当前补偿达标即下降
drop_descent_speed_mps: 1.0
drop_descent_mode4_speed_mps: 0.60  # 模式4最高向下速度，ENU指令为负值
drop_descent_acceleration_mps2: 0.60
drop_descent_braking_mps2: 0.60
drop_descent_hold_tolerance_m: 0.015  # 距终点1.5cm切回Z位置保持；非释放门槛
drop_agl: 0.25  # FC离地目标；释放窗口保持原配置，勿与local Z混用
release_min_agl: 0.10
release_max_agl: 0.43
landing_transit_agl: 1.0
landing_capture_agl: 1.2
landing_xy: null
cruise_speed: 0.5
cruise_acceleration: 0.35
virtual_ceiling_enabled: false
alignment_mode: legacy_static
actuator_mode: mock
raw_servo_service: /legacy/Servo_raw
trial_kind: full_mission
corridor_waypoints: []
# Enabled for the 2026-10-06 board validation; keep module-specific safety gates.
motion_optimization:
  enabled: true

# Promoted from the operator-confirmed H flight on 2026-10-06.
# Pilot completes final descent after visual alignment and POSCTL handoff.
landing_handoff_mode: POSCTL
# non_vh preserves ten-frame capture; vh: <=6cm, <0.1m/s for 1s; descent mode is independent.
landing_alignment_mode: vh
# 1: XYZ; 2: frozen H XY + Z ramp; 3: VX=VY=0 + Z ramp.
landing_descent_mode: 2
landing_descent_speed_mps: 1.0

# Per-motion action budget, including merged corridor segments (seconds).
motion_action_timeout: 60.0
# 普通固定航点：false=位置到达立即推进；true=位置连续达标0.3秒；两者均不检查速度。
# 不改变动态投递接近、视觉对准、恢复及H降落交接判定。
ordinary_waypoint_dwell_enabled: false

# 来源 073c8f19：低位 H POSCTL 停稳参数；现场其他参数保持本分支值。
landing_posctl:
  target_agl: 0.35
  trigger_agl: 0.50  # Low H handoff checks height only; FC AGL ceiling.
  xy_tolerance_m: 0.05
  height_tolerance_m: 0.05
  capture_height_tolerance_m: 0.10  # Independent legacy capture-height tolerance.
  max_horizontal_speed_mps: 0.10
  max_vertical_speed_mps: 0.10 # Compatibility field; not checked during H handoff.
  stable_duration_sec: 0.15
  max_odom_age_sec: 0.2
  max_sample_gap_sec: 0.2
  min_samples: 3

# Resume at most once with original mission budget and existing fresh-map checks.
resume_survey_enabled: true

# 起飞专用 Z 领先量，单位米（非 m/s）；生产默认保守回退旧通用 3D 限幅。
# 保留显式 [0.4, 0.6] 试验选项；回退不代表已证明领先量是全部偏高根因。
takeoff_z_lead_m: 0.0

# 仅用于实机外部 LAND：到达实测 H 预设点的 XY/Z 容差范围后开始计时。
# 坐标兜底固定使用预设 H 中心，水平误差和速度持续达标后才下降。
landing_coordinate_fallback:
  enabled: true
  wait_sec: 10.0
  arrival_xy_tolerance_m: 0.20
  arrival_z_tolerance_m: 0.15
  descend_xy_tolerance_m: 0.08
  max_horizontal_speed_mps: 0.10
  stable_duration_sec: 0.30
