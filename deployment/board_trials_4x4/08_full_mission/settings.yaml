mode: high_view_full
low_agl: 1.4
high_agl: 2.6
drop_agl: 0.6
landing_transit_agl: 1.0
landing_capture_agl: 1.8
landing_xy: null
cruise_speed: 0.5
cruise_acceleration: 0.35
virtual_ceiling_enabled: false
alignment_mode: legacy_static
actuator_mode: mock
raw_servo_service: /legacy/Servo_raw
trial_kind: full_mission
corridor_waypoints: []

# Promoted from the operator-confirmed H flight on 2026-10-06.
# Pilot completes final descent after visual alignment and POSCTL handoff.
landing_handoff_mode: POSCTL
# 仅用于 POSCTL：静置 FC 离地 0.22m 时，目标处脚架名义间隙为 0.13m。
# 最终停稳使用冻结 H 点；AUTO.LAND 不应用本参数块。
landing_posctl:
  target_agl: 0.35
  trigger_agl: 0.37
  xy_tolerance_m: 0.05
  height_tolerance_m: 0.02
  capture_height_tolerance_m: 0.10  # 仅观察高位；低位高度容差仍为 ±0.02m。
  max_horizontal_speed_mps: 0.03
  max_vertical_speed_mps: 0.05
  stable_duration_sec: 0.5
  max_odom_age_sec: 0.2
  max_sample_gap_sec: 0.2
  min_samples: 3
