mode: landing
trial_kind: corridor_landing
corridor_waypoints: []
landing_xy: null
low_agl: 1.4
high_agl: 2.6
drop_agl: 0.6
landing_transit_agl: 1.4
landing_capture_agl: 1.8
cruise_speed: 0.5
cruise_acceleration: 0.35
virtual_ceiling_enabled: false
alignment_mode: legacy_static
actuator_mode: mock
raw_servo_service: /legacy/Servo_raw

# Promoted from the operator-confirmed H flight on 2026-10-06.
# Pilot completes final descent after visual alignment and POSCTL handoff.
landing_handoff_mode: POSCTL
# 仅用于 POSCTL：静置 FC 离地 0.22m 时，目标处脚架名义间隙为 0.13m。
# 低位短确认使用冻结H点并允许受控缓降；AUTO.LAND不应用本参数块。
landing_posctl:
  target_agl: 0.35
  trigger_agl: 0.37
  xy_tolerance_m: 0.05
  height_tolerance_m: 0.02
  capture_height_tolerance_m: 0.10  # 高位独立容差；低位仅保留安全下界和显式请求上限。
  max_horizontal_speed_mps: 0.08
  max_vertical_speed_mps: 0.10
  stable_duration_sec: 0.15
  max_odom_age_sec: 0.2
  max_sample_gap_sec: 0.2
  min_samples: 3

# 与B已通过的试飞入口一致：运动优化默认开启；导航故障恢复仍由生成器显式关闭。
motion_optimization:
  enabled: true
