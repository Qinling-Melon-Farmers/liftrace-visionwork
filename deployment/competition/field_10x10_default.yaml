# 默认10×10正赛配置：几何来源于用户10x10正赛.yaml（2026-10-14）。
# 补齐原正式模板的非几何参数；未自动确认场地，未实飞验收。
# XY相对起飞点，AGL为飞控中心离地高度。原空模板保留为field.example.yaml。
