# 仅用于已验收有限测试场地的独立参考；不是正式比赛默认，不自动部署。
# 来源：board_full_mission_20261007_221730/run_metadata.json 的实际 settings，
# 不从本地旧 namedsite 取门前后点；两个门的前后 Y 为1.0/-0.7、-1.1/-2.5。
# 保留高2m、投0.35m、H1.2m、速0.5m/s、加0.35m/s²、动作60s的测试妥协。
# 本文件适配独立生成器：flight_bounds采用原 target_bounds 作外层许可边界；
# 原飞行中心范围保留在 search_center_bounds；原始 settings完整另存验证目录。
# 即使使用相同参考也不宣称生成输出或整机源码逐字等同成功轮，差异见报告。
# agl为 FC 离地高度，XY以静止起飞参考为基准；换场地必须重新测量。
# 必须显式 --site-config 指定本文件；入口从不默认选择它。
