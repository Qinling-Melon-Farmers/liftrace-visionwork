<h1>ROS 计算图 · Nodes only</h1><p>椭圆：实际注册节点；连线文字：ROS 话题；箭头：发布→订阅。
完整图保留评测和录像；核心图仅保留主要传感器、任务与控制话题；仅飞行版为本轮实际节点的运行链筛选。
未启动实机雷达、相机SDK或机械舵机节点，不将它们虚构入图。服务不画成话题。
这是归档ROS注册快照的离线重绘，不代表实时流量或板端验收。<a href="README.md">来源与范围</a></p>
