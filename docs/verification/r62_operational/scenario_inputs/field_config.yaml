  world_x: 1.8
  world_y: 2.7
  radius: 0.43
- name: combined_tree_2
  world_x: -1.5
  world_y: 5.2
  radius: 0.43
- name: combined_tree_3
  world_x: 1.7
  world_y: 5.7
  radius: 0.43
field:
  min_x: -4.8
  max_x: 4.8
  min_y: -0.5
  max_y: 9.1
search_region:
  min_x: -4.8
  max_x: 4.8
  min_y: -0.5
