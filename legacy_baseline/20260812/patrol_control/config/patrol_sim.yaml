  - {x: -5.5, y: 0.5, z: 1.4,yaw: 0.0, pointmode: "Detect_point", hover_time: 10.0}
  - {x: 0.0, y: 2.5, z: 1.4,yaw: 0.0, pointmode: "Detect_point", hover_time: 10.0}
