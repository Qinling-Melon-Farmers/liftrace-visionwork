  - {x: 4.5, y: -3.0, z: 1.4,yaw: 0.0, pointmode: "Detect_point", hover_time: 10.0}
land_height: 0.3                            #切入降落之前的高度，不要太高，也不能太小（太小容易与地面剐蹭）
px4_max_distance: 1.0                       #直接发送点位时，最大变化距离（直接给mavros发送点时决定最大速度）
max_yaw_change: 0.2                         #直接发送点位时，最大变化yaw

# 渐进降高参数 (新增)
progressive_descent:
  enable: true                              #是否启用对准过程中的渐进降高功能
  target_height: 0.4                       #渐进降高的最终目标高度(m)
  intermediate_height: 0.7                  #中间高度(m)，在此高度前需要圆环检测调整
  descent_duration: 5.0                     #第一阶段：从初始高度到中间高度的时长(s)
  final_descent_duration: 2.0               #第二阶段：从中间高度到目标高度的时长(s)
  min_detection_count: 5                    #开始渐进降高前需要的最少检测次数

# 对准参数 (新增)
alignment:
  threshold: 20.0                           #对准阈值(像素)，像素误差小于此值认为已对准
  stable_count_threshold: 10                #连续对准次数阈值，连续对准超过此次数才认为稳定对准
  timeout: 30.0                             #对准超时时间(秒)，超过此时间强制进入降高阶段

# threshould
threshould: 
  takeoff_threshould: 0.3                   #判断是否到达起飞点的阈值
  waypoint_threshould: 0.3                  #判断是否到达路点点的阈值
  aligning_threshould: 0.05                 #判断是否到达对准点的阈值（降低到5cm，提高对准精度）
  landing_threshould: 0.15                  #判断是否到达降落点的阈值
  arrive_yaw_threshould: 0.3                #判断yaw是否到位的阈值

  times_detect_threshould: 40               #路点为对准时，调整到位的次数阈值(次)，判断次数大于这个阈值即认为已经对准
  waypoint_adjust_max_second_threshould: 15 #路点为对准时，最大调整时间阈值(s)，超过阈值直接去下一个点
  land_adjust_max_second_threshould: 10     #路点为对准时，最大调整时间阈值(s)，超过阈值直接降落
  planner_min_pub_threshould: 0.025         #限制往planner发送目标点的频率

# bool switch
switch:
 flag_planner_px4: 0    # 0: planner   1: px4  ，设为0则使用planner在路点之间规划路径，设为1则使用直线在路点之间飞行
 flag_landing_detect: 1 # land detect flag  ，该标志位判断是否需要精确降落，0代表不检测，直接降落，1代表接收降落检测对准目标，对准之后再降落
 auto_land: 1           # auto_land flag  ，该标志位判断是否需要切入auto land，0代表不使用autoland,直接发送高度为-1的点, 1代表使用auto land模式降落

# uav_vision 接线参数
uav_vision:
  selected_target_timeout: 1.0         # /uav_vision/selected_target 超时 [s]
  drop_offset_timeout: 1.0             # /uav_vision/drop_offset 超时 [s]
  pixel_to_meter_ratio: 0.0015         # 像素偏差到米制偏差的默认换算比例
  max_movement_distance: 0.5           # 单次像素闭环对准的最大平面位移 [m]
  drop_circle_radius_m: 0.5            # 投递圆环半径估计 [m]
  drop_cross_radius_m: 0.5             # 随机靶红十字外圈半径估计 [m]
  landing_pad_radius_m: 0.3            # 降落标识外圈半径估计 [m]
  enable_tank_interrupt: false         # 规则未完全确认前，不默认让 tank 触发搜索中断
